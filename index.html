<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>XEVION TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B0B0B;--card:#171717;--ink:#fff;--mut:#A3A3A3;--pri:#FF6A00;--pri2:#ff8f40;--acc:#2b1a0c;--accInk:#ffb27a;--line:#2a2a2a;--bad:#c2413a;--ok:#2f7d4f;--sh:0 8px 24px rgba(40,60,90,.12);--vh:100dvh;--vt:0px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Lao Looped","Noto Sans Lao",system-ui,sans-serif;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:800;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg)}
.brand{flex:1;min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{display:flex;align-items:center;gap:8px;flex:none}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 2px 8px rgba(40,60,90,.08)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{background:var(--pri);color:#fff;font-weight:800;font-size:16px;border-color:transparent}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:800 11px/18px sans-serif;text-align:center;padding:0 4px}
.bal{display:flex;flex-direction:column;justify-content:center;height:40px;padding:0 12px;border-radius:99px;background:var(--acc);color:var(--accInk);line-height:1.15;white-space:nowrap}
.bal small{font-size:10px;font-weight:600;opacity:.8}.bal b{font-size:13px;font-weight:800}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:600}
.btn{display:block;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:99px;padding:13px 22px;font-weight:700;width:100%;box-shadow:0 6px 16px rgba(255,106,0,.3)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:14px}
a.btn{text-align:center;text-decoration:none}
.hero{padding:8px 4px 4px}.hero h1{font-size:26px}.hero p{color:var(--mut);margin:4px 0 8px}
.row{display:flex;gap:10px}.row .col{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.card h3{font-size:17px}.card p{margin:4px 0 0;color:var(--mut);font-size:15px}.card p.sm2{font-size:12px}
.tools{display:flex;gap:10px;margin:12px 0}
input,select,textarea{width:100%;font:inherit;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);scroll-margin:90px 0}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(255,106,0,.2)}
input.bad,select.bad{border-color:var(--bad);background:#2a1210}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--pri)}
input[type=range]{padding:0;border:0;box-shadow:none;background:none;accent-color:var(--pri)}
.lb{font-size:13px;color:var(--mut);font-weight:600;margin:4px 0 -4px 6px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.art,.th{display:grid;place-items:center;overflow:hidden;position:relative;color:#fff;font-weight:800}
.art{aspect-ratio:1;border-radius:16px;font-size:44px}
.art img,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sold{position:absolute;top:6px;left:6px;z-index:1;font-size:12px;font-weight:600;background:rgba(31,35,41,.6);padding:1px 10px;border-radius:99px}
.pbadge{position:absolute;top:6px;right:6px;z-index:1;font-size:12px;font-weight:800;background:var(--acc);color:var(--accInk);padding:1px 10px;border-radius:99px}
.pn{font-size:14px;line-height:1.4;min-height:40px}
.price{font-weight:800;color:var(--pri);font-size:17px}
.old{color:var(--mut);text-decoration:line-through;font-size:13px;font-weight:400;margin-left:6px}
.st{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}.out{color:var(--bad)}
.th{width:56px;height:56px;border-radius:16px;flex:none;font-size:24px}
#edp .th{width:min(60vw,240px);height:min(60vw,240px);margin:6px auto 0;font-size:64px;border-radius:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:4px 0 12px;scrollbar-width:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--pri);color:#fff;border-color:transparent}
.sortw{position:relative;flex:none}
.sortb{display:flex;align-items:center;gap:8px;height:100%;min-width:156px;justify-content:space-between;background:var(--pri);color:#fff;border-radius:99px;padding:0 16px;font-weight:600;font-size:14px;white-space:nowrap}
.sortm{position:absolute;right:0;top:calc(100% + 8px);z-index:9;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--sh);display:grid;gap:2px}
.sortm button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;font-weight:600}
.sortm button.on{background:var(--bg);color:var(--pri)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.tag.ok{color:var(--ok)}.tag.wt{color:var(--bad)}
.prog{height:6px;border-radius:9px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:9px}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.ck{display:flex;align-items:center;gap:10px;font-weight:600}
.f{display:grid;gap:10px}
.seg{display:flex;background:var(--line);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:99px;font-weight:600;color:var(--mut)}
.seg.g button{font-weight:700}.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 2px 8px rgba(40,60,90,.12)}
.modal,.crop{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);background:rgba(31,35,41,.45);display:none;justify-content:center}
.modal{z-index:20;align-items:flex-end}.crop{z-index:40;align-items:center;padding:16px}
.modal.on,.crop.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:calc(var(--vh) - 16px);overflow-y:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.cbox{background:var(--card);border-radius:28px;padding:16px;width:100%;max-width:380px;display:grid;gap:10px}
.cbox p{margin:0;color:var(--mut);font-size:13px}
#cv{width:100%;aspect-ratio:1;border-radius:20px;touch-action:none;background:#fff;display:block;border:1px solid var(--line)}
.ov{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);z-index:18;background:var(--bg);overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.ov.on{display:block}#ed{z-index:22}
.ovh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);max-width:560px;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:var(--sh)}
.stat small{display:block;color:var(--mut);font-size:12px}.stat b{font-size:18px;font-weight:800}
.dt summary{font-weight:700;cursor:pointer;list-style:none}.dt summary::-webkit-details-marker{display:none}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}.acts2 select{flex:1;min-width:130px;padding:9px 12px;font-size:14px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;margin-top:10px;box-shadow:var(--sh)}
.pi{flex:1;min-width:0}.pi b{display:block;font-size:15px;line-height:1.35}.pi small{color:var(--mut);font-size:13px}
.pf{display:flex;align-items:center;gap:14px}.pf p{margin:0;color:var(--mut)}
.av.big{width:60px;height:60px;font-size:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.mh{margin:16px 0 8px;color:var(--mut);font-size:13px;font-weight:600}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mi{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13px;text-align:center}
.mi span{font-size:24px;line-height:1.2}.mi b{font-size:18px}
.mr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:10px;font-weight:600}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;height:64px;border-radius:99px;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;background:var(--card);border:1px solid var(--line);z-index:12;box-shadow:0 10px 28px rgba(40,60,90,.2)}
.bnav button{color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:6px 0}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav .home{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,var(--pri2),var(--pri));color:#fff;border:5px solid var(--bg);box-shadow:0 6px 18px rgba(43,120,216,.4);padding:0;justify-content:center}
.bnav .home svg{width:28px;height:28px;fill:#fff;stroke:#fff}
body.kb .bnav{display:none}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;display:none;max-width:90%;box-shadow:var(--sh)}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:linear-gradient(180deg,#e6f1fc,#f5f2ec 340px) no-repeat,var(--bg)}
.top{background:rgba(232,242,252,.92);backdrop-filter:blur(8px)}
.logo{width:40px;height:40px;border-radius:12px;display:block}
.hero2{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1f2329,#38404b);border-radius:28px;padding:14px;color:#fff;box-shadow:var(--sh)}
.hero2 img{width:84px;height:84px;border-radius:20px;flex:none}.hero2 p{margin:0;color:#c9d3df;font-size:15px}
.bnav{background:#252a31;border-color:#252a31}.bnav button{color:#b4bcc7}
.ib:disabled{opacity:.35}.seg button{padding:9px 4px;font-size:14px}
.seg.sc{overflow-x:auto;scrollbar-width:none}.seg.sc button{flex:none;padding:9px 14px;white-space:nowrap}
.bn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 12px;scrollbar-width:none}
.bnr{flex:none;width:100%;scroll-snap-align:start;position:relative;overflow:hidden;min-height:110px;border-radius:24px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--sh)}
.bnr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.bnr b,.bnr span{position:relative;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.bill .oh{padding:5px 0;border-bottom:1px dashed var(--line);align-items:flex-start}.bill .oh b{text-align:right;min-width:0;overflow-wrap:anywhere}
#prt{display:none}
@media print{body>*:not(#prt){display:none!important}#prt{display:block!important;color:#000;background:#fff;padding:16px}body{background:#fff!important;padding:0!important}}
/* top-up button now visible */
.au{display:none;height:40px;padding:0 12px;font-size:13px;font-weight:800;white-space:nowrap;align-items:center;flex:none}
.au.pri{background:var(--pri);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(255,106,0,.35)}
body.out .au{display:inline-flex}
body.out #av,body.out [data-x="bell"]{display:none}
.top .brand{flex:1 1 0}
.hid{display:none!important}
#mh{margin:2px 2px 10px;color:var(--mut,#6b7686);font-size:13px;text-align:center}

/* ===== XEVION neon theme ===== */
:root{--bg:#02040a;--card:#0a1220;--ink:#fff;--mut:#9fb0c8;--pri:#1f6fff;--pri2:#4aa8ff;--acc:#0b2347;--accInk:#8cc4ff;--line:#17325e;--sh:0 0 0 1px rgba(40,120,255,.14),0 10px 26px rgba(0,0,0,.55),0 0 18px rgba(31,111,255,.12)}
html{background:#000}
body{background:radial-gradient(900px 480px at 50% -140px,rgba(31,111,255,.42),transparent 70%),radial-gradient(420px 340px at 105% 40%,rgba(31,111,255,.16),transparent 70%),radial-gradient(420px 340px at -5% 66%,rgba(31,111,255,.16),transparent 70%),linear-gradient(180deg,#050a16,#000 720px) no-repeat,#000}
.top{background:rgba(0,0,0,.9);border-bottom:1px solid rgba(31,111,255,.55);box-shadow:0 8px 24px -10px rgba(31,111,255,.7);backdrop-filter:blur(10px)}
.ib{border-color:rgba(31,111,255,.5);box-shadow:0 0 10px rgba(31,111,255,.28)}
.av{background:linear-gradient(135deg,#4aa8ff,#1f6fff);box-shadow:0 0 12px rgba(31,111,255,.7)}
.card,.pc,.stat,.prow{border-color:rgba(31,111,255,.4);box-shadow:var(--sh)}
.pc{background:linear-gradient(180deg,#0d1832,#070d1a)}
.btn{background:linear-gradient(135deg,#4aa8ff,#1f6fff);box-shadow:0 0 18px rgba(31,111,255,.55);font-weight:800}
.btn.ghost{background:#0a1220;border:1px solid rgba(31,111,255,.55);box-shadow:none}
.chip{background:#0a1220;border-color:rgba(31,111,255,.45)}
.chip.on{background:linear-gradient(135deg,#4aa8ff,#1f6fff);box-shadow:0 0 14px rgba(31,111,255,.55)}
.sortb{background:linear-gradient(135deg,#4aa8ff,#1f6fff);box-shadow:0 0 14px rgba(31,111,255,.5)}
input,select,textarea{background:#060c18;border-color:#1b3a6e}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(31,111,255,.3)}
.hero2{background:linear-gradient(135deg,#02060f 0%,#0a2a6e 62%,#1f6fff 135%);border:1px solid rgba(74,168,255,.6);box-shadow:0 0 30px rgba(31,111,255,.5),inset 0 0 40px rgba(31,111,255,.18)}
.hero2 p{color:#e3eeff;font-weight:700;font-style:italic}
.bnav{background:rgba(3,7,15,.96);border:1px solid rgba(31,111,255,.65);box-shadow:0 0 24px rgba(31,111,255,.45)}
.bnav button{color:#9fb0c8}
.bnav .home{background:linear-gradient(160deg,#4aa8ff,#1f6fff);box-shadow:0 0 24px rgba(31,111,255,.85);border-color:#000}
.au.pri{box-shadow:0 0 14px rgba(31,111,255,.65)}
.bnr{background:linear-gradient(135deg,#0a2a6e,#1f6fff)}
.sheet{background:#070d1a;border:1px solid rgba(31,111,255,.45);border-bottom:0}
.ov,.ovh{background:#02040a}
.sortm{background:#070d1a;border-color:rgba(31,111,255,.5)}
.seg{background:#0b1a33}
.tag{border-color:rgba(31,111,255,.4)}
/* ===== phone input with locked +856 20 ===== */
.phw{display:flex;align-items:center;border:1.5px solid #1b3a6e;border-radius:16px;background:#060c18;overflow:hidden}
.phw:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px rgba(31,111,255,.3)}
.phw:has(input.bad){border-color:var(--bad);background:#2a1210}
.pfx{flex:none;padding:13px 2px 13px 16px;font-weight:800;color:var(--accInk);user-select:none;-webkit-user-select:none;white-space:nowrap}
.phw input,.phw input.bad,.phw input:focus{border:0;background:transparent;box-shadow:none;border-radius:0;padding-left:8px;letter-spacing:1px}
/* ===== contact ===== */
.wab{flex:none;width:44px;height:44px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 0 14px rgba(37,211,102,.55)}
.wab svg{width:26px;height:26px;fill:#fff}
#ctsec{margin-top:22px}
pre.sqlp{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#02040a;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0 0;max-height:240px;overflow:auto;color:#cfe2ff}
/* ===== v2: picker / cart bar / top-up ===== */
body.out .bal{display:none!important}
.bal{padding:0 10px}
.ib[data-o="cart"]{background:linear-gradient(135deg,#4aa8ff,#1f6fff);border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(31,111,255,.75)}
.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.cfab{position:fixed;left:14px;right:14px;max-width:532px;margin:0 auto;bottom:calc(106px + env(safe-area-inset-bottom,0px));z-index:11;display:flex;align-items:center;gap:12px;padding:9px 16px 9px 10px;border-radius:99px;background:linear-gradient(135deg,#4aa8ff,#1f6fff);color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:0 0 24px rgba(31,111,255,.8),0 10px 26px rgba(0,0,0,.55);text-align:left}
.cfab .cfi{position:relative;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:20px;flex:none}
.cfab .cfn{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font:800 12px/20px sans-serif;text-align:center;padding:0 5px;font-style:normal}
.cfab .cft{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.cfab .cft small{font-size:12px;font-weight:600;opacity:.9}.cfab .cft b{font-size:17px;font-weight:800}
.cfab .cfg{font-weight:800;font-size:14px;white-space:nowrap}
body.hascart{padding-bottom:178px}
body.kb .cfab{display:none}
/* picker */
.locg{display:grid;gap:10px}
.pkb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:18px;border:1.5px solid #1b3a6e;background:linear-gradient(180deg,#0b1730,#060c18);color:var(--ink);box-shadow:0 0 12px rgba(31,111,255,.14)}
.pkb:active{border-color:var(--pri)}
.pkb.dis{opacity:.55}
.pkb.bad{border-color:var(--bad);background:#2a1210}

function emvCrc(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return("000"+c.toString(16).toUpperCase()).slice(-4)}

var AC=null;
function audioUnlock(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state!=="running")AC.resume()}catch(e){}}
["click","touchstart","keydown"].forEach(function(ev){document.addEventListener(ev,audioUnlock,{passive:true})});
function tone(f,t,d,v){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
var CHM={note:[[880,0,.18,.35],[1175,.16,.3,.35]],money:[[523,0,.14,.4],[659,.12,.14,.4],[784,.24,.14,.4],[1047,.36,.55,.45]],admin:[[988,0,.2,.7],[1319,.18,.25,.7],[988,.5,.2,.7],[1319,.68,.25,.7],[988,1,.2,.7],[1319,1.18,.4,.7]]};
function chime(k){try{audioUnlock();if(!AC)return;var t=AC.currentTime+.02;(CHM[k]||[]).forEach(function(n){tone(n[0],t+n[1],n[2],n[3])})}catch(e){}}

 e.classList.add("on");clearTimeout(moneyIn.t);moneyIn.t=setTimeout(function(){e.classList.remove("on")},8000);try{if(navigator.vibrate)navigator.vibrate([120,60,120])}catch(x){}}
