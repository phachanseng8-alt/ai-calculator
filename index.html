<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>VANTA Fitness Equipment</title><meta name="description" content="VANTA ອຸປະກອນຟິດເນດ ສົ່ງຮອດບ້ານ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;800&family=Montserrat:ital,wght@0,600;0,800;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--moss:#34322E;--moss2:#6F6A63;--lime:#EAE6DF;--fire:#FF5A2C;--fire2:#E8431A;--sage:#F3F1EE;--card:#FBFAF8;--ink:#2A2825;--mute:#6F6A63;--line:#E3DFD8;--ok:#25703F;--err:#C9342A;--warn:#8F5A00;--okbg:#E4F1E7;--errbg:#F9E5E1;--warnbg:#FAEFD3;--infobg:#E9E5DE;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{color-scheme:only light;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sage);color:var(--ink);font:16px/1.75 'Montserrat','Noto Sans Lao',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--fire);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.strip{background:#E9E6E0;color:var(--ink);border-bottom:1px solid var(--line);font-size:13px;padding:6px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.strip button{padding:4px 14px;border-radius:99px;min-height:36px;background:#2A28250F;color:inherit;font-weight:600;transition:.25s}
.strip button.on{background:var(--ink);color:#fff}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
header.top:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:21}
.hd{display:flex;align-items:center;gap:8px;min-height:60px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--fire);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.sp{flex:1}
.ib{min-width:48px;min-height:48px;border-radius:14px;position:relative;font-size:22px;display:grid;place-items:center;transition:.2s}
.ib:active{transform:scale(.9)}
.badge{position:absolute;top:2px;right:2px;min-width:20px;height:20px;border-radius:99px;background:var(--fire);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:800;padding:0 5px}
.badge.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.6) rotate(-8deg)}60%{transform:scale(.9)}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:800;background:var(--fire);color:#fff;transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 6px 0 var(--fire2)}
.btn:hover{background:#FF6B40}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--fire2)}
.btn.sec{background:var(--card);color:var(--moss);box-shadow:0 0 0 2px var(--moss) inset}
.btn.sec:active{box-shadow:0 0 0 2px var(--moss) inset;transform:scale(.97)}
.btn.lime{background:var(--ink);color:#fff;box-shadow:0 6px 0 #0E0D0C}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;box-shadow:0 4px 0 var(--fire2)}
.btn.sm.sec{box-shadow:0 0 0 2px var(--moss) inset}
.btn.block{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn.ok{background:var(--ok);box-shadow:0 6px 0 #17653A}
.btn.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.rip{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.spin{width:18px;height:18px;border:3px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{background:#E8E5DF;color:var(--ink);padding:28px 0 36px;overflow:hidden;position:relative}
.hero h1{font-size:clamp(30px,8vw,52px);line-height:1.35;margin:0 0 10px;font-weight:800;max-width:14em}
.hero p{margin:0 0 20px;color:var(--mute);max-width:30em}
.plate{position:absolute;right:-70px;top:-40px;width:260px;opacity:.9;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:600;transition:.2s;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;transform:scale(1.04)}
.chip:active{transform:scale(.94)}
.finder{background:var(--card);border-radius:22px;padding:18px;margin-top:-22px;position:relative;box-shadow:0 14px 30px #4A3F3318}
.finder h2,.sec h2{font-size:21px;margin:0 0 8px;line-height:1.5}
.lbl{font-size:14px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.rec{margin-top:14px;padding:12px;border-radius:16px;background:#EAE6DF;color:var(--ink);border:1px solid var(--line);display:flex;gap:12px;align-items:center;animation:pop .45s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.sec{padding:26px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pc{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;border:1px solid var(--line)}
.pc:hover{transform:translateY(-3px);box-shadow:0 12px 24px #4A3F3320}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:64px;cursor:pointer}
.pc .in{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc h3{font-size:15px;margin:0;line-height:1.55;cursor:pointer}
.price{font-weight:800;font-size:18px;color:var(--moss);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.err{background:var(--errbg);color:var(--err)}.tag.info{background:var(--infobg);color:var(--ink)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-size:14px}
.trust div{background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--line)}
.crumb{padding:12px 0;font-size:14px}.crumb button{color:var(--moss2);font-weight:700;min-height:44px}
.pd{display:grid;gap:16px}
@media(min-width:800px){.pd{grid-template-columns:1fr 1fr;align-items:start}}
.big{border-radius:24px;aspect-ratio:1.1;display:grid;place-items:center;font-size:120px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{color:var(--mute);width:46%}
.box{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:17px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.stick{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:10}
.scrim{position:fixed;inset:0;background:#2A2825aa;opacity:0;pointer-events:none;transition:.3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--sage);z-index:41;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;padding:8px 8px 8px 16px;font-weight:800;font-size:18px}
.db{flex:1;overflow:auto;padding:0 16px 16px}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.line{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .th{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none}
.qty{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.qty button{width:44px;height:44px;font-size:20px;font-weight:800;color:var(--moss)}.qty button:active{background:var(--line)}.qty b{min-width:26px;text-align:center}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.row.t{font-weight:800;font-size:19px;border-top:2px dashed var(--line);margin-top:6px;padding-top:10px}
select,input[type=text],input[type=tel],input[type=password],input[type=search]{width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;transition:.2s}
select:focus,input:focus{border-color:var(--ink);outline:0;box-shadow:0 0 0 4px #2A282520}
.f{margin-bottom:12px}.f label{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.f.bad input,.f.bad select{border-color:var(--err);background:var(--errbg);animation:shake .4s}
.em{color:var(--err);font-size:13px;display:none}.f.bad .em{display:block}
.pay{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:.2s;background:var(--card);min-height:56px}
.pay.on{border-color:var(--ink);background:#F0EDE8;transform:scale(1.015)}
.pay input{accent-color:var(--fire);width:22px;height:22px}
.fl{display:flex;gap:10px;align-items:center;min-height:44px}.fl input{width:22px;height:22px;accent-color:var(--fire)}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.tst{pointer-events:auto;width:min(420px,100%);display:flex;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:0 12px 30px #2A282526;border-left:6px solid var(--ok);position:relative;overflow:hidden;animation:tin .45s cubic-bezier(.2,1.2,.3,1)}
.tst.err{border-color:var(--err)}.tst.warn{border-color:var(--warn)}
.tst.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(-40px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
.ti{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ok)}
.tst.err .ti{background:var(--err)}.tst.warn .ti{background:var(--warn)}
.tst b{display:block;line-height:1.5}.tst span{font-size:14px;color:var(--mute);line-height:1.5;display:block}
.tst .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);animation:bar 3.6s linear forwards}.tst.err .bar{background:var(--err)}
@keyframes bar{from{width:100%}to{width:0}}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:#2A2825aa;animation:fade .25s}
.modal.sheet{place-items:end center;padding:0}
@keyframes fade{from{opacity:0}}
.mc{background:var(--card);border-radius:26px;padding:26px 22px;width:min(440px,100%);text-align:center;animation:pop .45s cubic-bezier(.2,1.3,.3,1);max-height:92vh;overflow:auto}
.sheet .mc{border-radius:26px 26px 0 0;text-align:left;width:min(640px,100%);animation:up .35s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(100%)}}
.chk{width:96px;height:96px;margin:0 auto 6px}
.chk circle{fill:none;stroke:var(--ok);stroke-width:6;stroke-dasharray:283;stroke-dashoffset:283;animation:dr .6s .1s forwards;transform-origin:center;transform:rotate(-90deg)}
.chk path{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .65s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.dot{position:fixed;width:20px;height:20px;border-radius:50%;background:var(--fire);z-index:90;pointer-events:none}
.admin{padding-bottom:30px}
.ah{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0}
.tabs{display:flex;gap:6px;padding:10px 0;overflow-x:auto}
.tabs .chip{white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:20px;padding:14px;text-align:left;border:1px solid var(--line);transition:.2s}
.tile:active{transform:scale(.96)}.tile:hover{border-color:var(--moss2)}
.tile b{font-size:32px;display:block;line-height:1.3;font-family:Sora}
.tile.hot{background:var(--fire);color:#fff;border-color:var(--fire)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--moss2);border-radius:8px 8px 3px 3px;position:relative;transform-origin:bottom;animation:grow .7s backwards}
.bars div:last-child{background:var(--fire)}
@keyframes grow{from{transform:scaleY(0)}}
.bars small{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}
.oc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;min-height:64px;transition:.2s}
.oc:active{transform:scale(.98)}
.tl{list-style:none;margin:10px 0;padding:0}
.tl li{display:flex;gap:12px;align-items:center;padding:4px 0;color:var(--mute)}
.tl li i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;font-style:normal;color:#fff}
.tl li.d{color:var(--ink)}.tl li.d i{background:var(--ok);border-color:var(--ok)}.tl li.c i{border-color:var(--fire);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #FF5A2C33}}
.sbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}.sbar i{display:block;height:100%;background:var(--ok);transition:width .6s}.sbar.low i{background:var(--fire)}
.empty{text-align:center;padding:36px 12px;color:var(--mute)}.empty big{display:block;font-size:56px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.slipl:focus-within .btn{outline:3px solid var(--fire);outline-offset:2px}
.walc{min-height:44px;padding:0 12px;font-size:14px;font-weight:800;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.walc.flash{animation:flash 1.1s}
@keyframes flash{30%{background:#EAE6DF;color:var(--ink);transform:scale(1.12)}}
.balbig{background:#34322E;color:#F6F4F0;border-radius:20px;padding:14px 18px;margin:10px 0}.balbig small{display:block;color:#D2CDC5}.balbig b{font-size:32px;font-variant-numeric:tabular-nums}
@media(max-width:400px){.logo small{display:none}.logo em{font-size:19px}} /* ຢ່າເຊື່ອງຊື່ VANTA ໃນຈໍນ້ອຍ */
.pc h3{min-height:3.1em} /* ຊື່ສິນຄ້າ 2 ແຖວ ໃຫ້ລາຄາຢູ່ລະດັບດຽວກັນ */
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.sel{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;transition:.2s}
.sel:active{transform:scale(.99)}.sel:hover{border-color:var(--moss2)}
.sel b{display:block;line-height:1.5;font-weight:700}.sel small{display:block;color:var(--mute);line-height:1.4}.sel .ph{color:var(--mute);font-weight:600}
.sel i{font-style:normal;color:var(--mute);font-size:24px}
.f.bad .sel{border-color:var(--err);background:var(--errbg);animation:shake .4s}
.pk{position:fixed;inset:0;z-index:80;background:#2A2825aa;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.pkc{background:var(--sage);width:min(560px,100%);height:min(86vh,720px);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.pkh{display:flex;align-items:center;gap:4px;padding:10px 8px 2px}
.pkh b{flex:1;font-size:18px;text-align:center}
.pks{padding:6px 16px 10px}
.pkl{flex:1;overflow:auto;padding:0 12px 18px}
.pki{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;min-height:58px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;transition:.15s}
.pki:active{transform:scale(.985);background:#EFECE6}
.pki.on{border-color:var(--ink);background:#EFECE6}
.pki .t{flex:1}.pki b{display:block;line-height:1.5}.pki small{display:block;color:var(--mute);line-height:1.4}
.pki .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.pki.on .ck{background:var(--ink);border-color:var(--ink)}
.pkg{font-size:13px;color:var(--mute);font-weight:700;margin:12px 4px 6px}
.seg{display:flex;background:#EAE6DF;border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;color:var(--mute);transition:.2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #4A3F3326}
.pw{position:relative}.pw input{padding-right:52px}.eye{position:absolute;right:2px;top:0;bottom:0;width:48px;font-size:18px}
.ib.av{min-width:40px;min-height:40px;width:40px;height:40px;border-radius:50%;background:#EAE6DF;border:1px solid var(--line);font-size:20px}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0;text-align:center}
.ah .hd{flex-wrap:wrap;gap:6px 8px;padding:6px 0}.ah .logo{white-space:nowrap;font-size:18px}.ah .tag,.ah .btn{white-space:nowrap}.ah .btn.sm{min-width:64px;padding:0 16px}
.plate{opacity:.5!important;right:-120px;top:-60px}
/* ===== VANTA look (ຂາວ-ເທົາ + ສີສົ້ມ + ດຳ) ===== */
:root{--fire:#FF7A00;--fire2:#D96500;--moss:#161616;--moss2:#555;--ink:#161616;--sage:#F4F4F4;--card:#fff;--mute:#666;--line:#E4E4E4;--lime:#eee;--infobg:#EDEDED;--warnbg:#FFF1DC;--warn:#8A4B00}
html{-webkit-text-size-adjust:100%}
.skip{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:8px 14px;z-index:200}.skip:focus{left:8px;top:8px}
.wrap{max-width:1200px;padding:0 16px}
@media(min-width:700px){.wrap{padding:0 28px}}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top:before{background:#fff}
.hd{min-height:64px;gap:6px;position:relative}
.i{width:24px;height:24px;display:block}
.logo{gap:10px;text-align:left}

const NOCLEAN=new Set(['password','slip','image','qr']);
function cleanStr(s){return String(s).normalize('NFC').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'').replace(/[<>]/g,'').trim().slice(0,300)}
function cleanBody(v,k){
 if(v==null)return v;
 if(typeof v=='string')return NOCLEAN.has(k)?v:cleanStr(v);
 if(Array.isArray(v))return v.map(x=>cleanBody(x,k));
 if(typeof v=='object'){const o={};for(const a in v)o[a]=cleanBody(v[a],a);return o}
 return v}

function lkLoad(){try{return JSON.parse(localStorage.getItem('vlk')||'{}')||{}}catch(e){return {}}}
function lkSave(o){try{localStorage.setItem('vlk',JSON.stringify(o))}catch(e){}}
function lockErr(u){const s=Math.max(1,Math.ceil((u-Date.now())/1000)),m=Math.floor(s/60);const e=apiErr(429,'LOCKED','ລອງຜິດຫຼາຍເກີນໄປ — ຖືກລ໋ອກ ລໍຖ້າ '+(m?m+' ນາທີ ':'')+(s%60)+' ວິນາທີ ແລ້ວລອງໃໝ່');e.until=u;return e}
function lockKeys(path,body){
 let kind;if(path==='/auth/login'||path==='/auth/register')kind='u';else if(path==='/admin/login')kind='a';else return null;
 const b=body||{},id=kind=='a'?String(b.username||''):String(b.email||b.phone||'');
 return [kind+':'+(id.trim().toLowerCase()||'?').slice(0,120),'dev:'+kind]}
function lockUntil(kind){const l=lkLoad()['dev:'+kind];return l&&l.u>Date.now()?l.u:0}
function lockCheck(ks){const o=lkLoad(),now=Date.now();let m=0;ks.forEach(k=>{const l=o[k];if(l&&l.u>now&&l.u>m)m=l.u});if(m)throw lockErr(m)}
function lockFail(ks){const o=lkLoad(),now=Date.now();let m=0;
 ks.forEach(k=>{const l=o[k]||(o[k]={n:0,u:0,t:0});if(l.u&&l.u<=now){l.u=0;l.n=0}if(l.t&&now-l.t>600000)l.n=0;if(!l.n)l.t=now;if(++l.n>=5){l.u=now+600000;l.n=0;l.t=0;if(l.u>m)m=l.u}});
 Object.keys(o).forEach(k=>{if(!o[k].u&&!o[k].n)delete o[k]});lkSave(o);return m?lockErr(m):null}
function lockOk(ks){const o=lkLoad();ks.forEach(k=>delete o[k]);lkSave(o)}

 L.forEach(n=>{const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(EMO,(m,k)=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`);n.replaceWith(...sp.childNodes)})}

 try{const t=await API('/topups','POST',{amount:q.a,method:q.m,slip:topSlip});try{await rpc(sbU,'confirm_topup_hold',{p_amount:q.a})}catch(_){}qrDrop();topSlip=null;tops.unshift(t);toast('ok','ແຈ້ງເຕີມເງິນແລ້ວ','ລໍຖ້າຮ້ານກວດ '+K(q.a));loop();render();scrollTo({top:0})}
 catch(e){toast('err','ແຈ້ງເຕີມເງິນບໍ່ສຳເລັດ',e.message);b.disabled=false;b.classList.remove('ld')}}

/* --- ໜ້າທີ 3: ໂຄ້ດເງິນ (ແຍກຈາກ QR) --- */
function topCodeView(){
 return `<div class="wrap" style="padding:0 16px 30px">${tpBack()}<div class="tpbox"><h1>🎉 ໂຄ້ດເງິນ</h1><p>ປ້ອນໂຄ້ດທີ່ໄດ້ຮັບຈາກຮ້ານ ເງິນຈະເຂົ້າກະເປົາທັນທີ</p>
<div class="balbig" style="margin-top:0"><small>ຍອດຄົງເຫຼືອ</small><b data-bal data-v="${wallet.bal}">${K(wallet.bal)}</b></div>
<div class="f" id="f-code"><label>ໂຄ້ດເງິນ <span style="color:var(--err)">*</span></label><div class="tprow"><input type="text" id="codein" maxlength="24" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ເຊັ່ນ ABCD-EFGH-JKLM" onkeydown="if(event.key=='Enter')redeemCode($('#codebtn'))"><button class="btn" id="codebtn" onclick="redeemCode(this)">ໃຊ້ໂຄ້ດ</button></div><div class="em">ໂຄ້ດບໍ່ຖືກຮູບແບບ</div></div>
<div class="tptips"><b>ຄຳແນະນຳ</b><ul><li>ແຕ່ລະໂຄ້ດໃຊ້ໄດ້ຄັ້ງດຽວເທົ່ານັ້ນ</li><li>ໃສ່ໂຄ້ດຜິດ 5 ຄັ້ງ ຈະຖືກລ໋ອກ 10 ນາທີ</li><li>ໂຄ້ດອອກໃຫ້ໂດຍຮ້ານ — ຖ້າບໍ່ມີ ຕິດຕໍ່ຮ້ານ</li></ul></div></div></div>`}
async function redeemCode(b){
 const code=(($('#codein')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,''),f=$('#f-code'),ks=['code:'+ses.u,'dev:code'];
 f.classList.remove('bad');
 if(code.length<8||code.length>20){f.classList.add('bad');f.querySelector('.em').textContent='ໂຄ້ດບໍ່ຖືກຮູບແບບ';return}
 try{lockCheck(ks)}catch(e){toast('err','ຖືກລ໋ອກຊົ່ວຄາວ',e.message);return}
 b.disabled=true;
 try{
  const r=await rpc(sbU,'redeem_code',{p_code:code});
  if(r&&r.ok){
   if(ses.user&&ses.user.w)ses.user.w.bal=Number(r.balance)||0;setW();paintWallet(true);
   const i=$('#codein');if(i)i.value='';
   toast('ok','ໃຊ້ໂຄ້ດສຳເລັດ +'+K(Number(r.amount)||0),'ຍອດໃໝ່ '+K(wallet.bal));return}
  const M={CODE_INVALID:'ໂຄ້ດບໍ່ຖືກ',CODE_USED:'ໂຄ້ດນີ້ຖືກໃຊ້ໄປແລ້ວ',CODE_EXPIRED:'ໂຄ້ດໝົດອາຍຸແລ້ວ',CODE_LOCKED:'ລອງຜິດຫຼາຍເກີນໄປ — ຖືກລ໋ອກ '+Math.ceil(((r&&r.seconds)||600)/60)+' ນາທີ'};
  const msg=M[r&&r.error]||'ໃຊ້ໂຄ້ດບໍ່ສຳເລັດ';
  f.classList.add('bad');f.querySelector('.em').textContent=msg;
  if(r&&r.error!='CODE_LOCKED'){const le=lockFail(ks);if(le)toast('err','ລອງຜິດຫຼາຍເກີນໄປ',le.message)}
  toast('err','ໃຊ້ໂຄ້ດບໍ່ໄດ້',msg)
 }catch(e){
  toast('err','ໃຊ້ໂຄ້ດບໍ່ໄດ້',/function|schema|not find/i.test(e.message||'')?'ຮ້ານຍັງບໍ່ໄດ້ເປີດລະບົບໂຄ້ດເງິນ (ຍັງບໍ່ໄດ້ຣັນ SQL)':(e.message||'ລອງໃໝ່'));
  if(e.status==401){ses.u=null;ses.user=null;setW();refreshHead()}
 }finally{b.disabled=false}}

/* --- ເຊື່ອມໜ້າໃໝ່ເຂົ້າລະບົບ view ເດີມ --- */
{const _sh=shop;shop=function(){if(view=='topup')return head()+topLand();if(view=='topqr')return head()+topQrView();if(view=='topcode')return head()+topCodeView();return _sh.apply(this,arguments)}}
walletSheet=function(){if(!me()){authSheet('login');return}closeModal();closeDrawer();if(view!='topup')go('topup');else render()};
{const _cm=closeModal;closeModal=function(){_cm.apply(this,arguments);walOpen=(mode=='shop'&&/^top/.test(view))}}
{const _rd=render;render=function(){_rd.apply(this,arguments);walOpen=(mode=='shop'&&/^top/.test(view)&&!document.querySelector('#mod .modal'));if(walOpen)refreshWal()}}
setInterval(()=>{const c=$('#qrcd');if(!c||mode!='shop')return;const r=+c.dataset.e-Date.now();c.classList.toggle('low',r>0&&r<60000);
 if(r<=0){qrDrop();toast('warn','QR ໝົດອາຍຸແລ້ວ','ສ້າງລາຍການໃໝ່ ຖ້າຍັງຕ້ອງການເຕີມເງິນ');render();return}
 c.textContent=qrFmt(r)},1000);

/* ===== ແອດມິນ: ສ້າງ/ເບິ່ງໂຄ້ດເງິນ ===== */
ATABS.push(['codes','🎉','Codes','ຈັດການໂຄ້ດເງິນ']);
let codeList=null,codeAt=0,codeErr='',lastGen='';const cdv={amt:'',cnt:'1',day:'30',note:''};
const fmtCode=c=>String(c).replace(/(.{4})(?=.)/g,'$1-');
function codeAdm(){
 const typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
 if(!typing&&(!codeList||Date.now()-codeAt>30000)){codeAt=Date.now();rpc(sbA,'admin_list_codes').then(d=>{codeList=d||[];codeErr='';render()}).catch(e=>{codeList=codeList||[];codeErr=e.message||'error';render()})}
 const fi=(k,l,t,x)=>`<div class="f"><label>${l}</label><input type="${t}" value="${esc(cdv[k])}" oninput="cdv.${k}=this.value" ${x||''}></div>`;
 const list=(codeList||[]).map(c=>{const exp=c.expires_at&&new Date(c.expires_at)<=new Date(),st=c.used_at?['ໃຊ້ແລ້ວ','ok']:exp?['ໝົດອາຍຸ','err']:['ຍັງບໍ່ໃຊ້','warn'];
  return `<div class="oc" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:150px"><b style="font-family:monospace;letter-spacing:.04em">${esc(fmtCode(c.code))}</b><br><small style="color:var(--mute)">${esc(c.note||'')}${c.used_by_name?' · ໃຊ້ໂດຍ '+esc(c.used_by_name):''}</small></div><div style="text-align:right"><b>${K(Number(c.amount)||0)}</b><br><span class="tag ${st[1]}">${st[0]}</span></div>${st[1]=='warn'?`<div style="width:100%">${bt('📋','ກ໊ອບໂຄ້ດ',`cp('${esc(fmtCode(c.code))}')`)}</div>`:''}</div>`}).join('');
 return `<div class="box"><h3>🎉 ສ້າງໂຄ້ດເງິນໃໝ່</h3>${fi('amt','ຈຳນວນເງິນຕໍ່ໂຄ້ດ (₭)','number','min="1000" max="50000000" inputmode="numeric"')}${fi('cnt','ຈຳນວນໂຄ້ດ (1–50)','number','min="1" max="50" inputmode="numeric"')}${fi('day','ໝົດອາຍຸພາຍໃນ (ວັນ, 0 = ບໍ່ໝົດ)','number','min="0" max="365" inputmode="numeric"')}${fi('note','ໝາຍເຫດ (ບໍ່ບັງຄັບ)','text','maxlength="80"')}<button class="btn block" onclick="genCodes(this)">ສ້າງໂຄ້ດ</button><small style="color:var(--mute)">ແຕ່ລະໂຄ້ດໃຊ້ໄດ້ຄັ້ງດຽວ · ລູກຄ້າປ້ອນທີ່ ເຕີມເງິນ → ໂຄ້ດເງິນ</small></div>`
 +(codeErr?roNote('ດຶງລາຍການໂຄ້ດບໍ່ໄດ້ — ກວດວ່າຣັນ SQL ໄຟລ໌ vanta_codes.sql ແລ້ວ ('+esc(codeErr)+')'):'')
 +(list||'<div class="empty"><big>🎉</big>ຍັງບໍ່ມີໂຄ້ດ</div>')}
async function genCodes(b){
 const amt=parseInt(cdv.amt,10),cnt=parseInt(cdv.cnt,10),day=parseInt(cdv.day,10)||0;
 if(!(amt>=1000&&amt<=50000000))return toast('err','ຈຳນວນເງິນບໍ່ຖືກ','ໃສ່ 1,000 – 50,000,000 ₭');
 if(!(cnt>=1&&cnt<=50))return toast('err','ຈຳນວນໂຄ້ດບໍ່ຖືກ','ໃສ່ 1 – 50');
 if(!(day>=0&&day<=365))return toast('err','ວັນໝົດອາຍຸບໍ່ຖືກ','ໃສ່ 0 – 365');
 b.disabled=true;
 try{const r=await rpc(sbA,'admin_create_codes',{p_amount:amt,p_count:cnt,p_days:day,p_note:(cdv.note||'').trim().slice(0,80)});
  const L=(r||[]).map(fmtCode);lastGen=L.join('\n');codeAt=0;codeList=null;
  modal(`<h2 style="margin:0 0 6px;font-size:20px">ສ້າງໂຄ້ດແລ້ວ ${L.length} ອັນ</h2><div class="box"><small style="color:var(--mute)">${K(amt)} ຕໍ່ໂຄ້ດ · ບັນທຶກ/ກ໊ອບໄວ້ ແລ້ວສົ່ງໃຫ້ລູກຄ້າ</small><textarea readonly rows="${Math.min(10,L.length+1)}" style="width:100%;margin-top:8px;font-family:monospace;padding:10px;border:1px solid var(--line);border-radius:12px">${esc(lastGen)}</textarea></div><button class="btn block" onclick="cp(lastGen)">📋 ກ໊ອບທັງໝົດ</button><button class="btn sec block" style="margin-top:10px" onclick="closeModal()">ປິດ</button>`,true);
  render()}
 catch(e){toast('err','ສ້າງໂຄ້ດບໍ່ສຳເລັດ',/function|schema|not find/i.test(e.message||'')?'ຍັງບໍ່ໄດ້ຣັນ SQL (vanta_codes.sql)':e.message);if(e.status==401){ses.a=null;render()}}
 finally{b.disabled=false}}
</script>
